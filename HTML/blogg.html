<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../dist/blogg.js" defer></script>
    <link rel="stylesheet" href="../CSS/bloggStyle.css">
    <title>Bloggsidan</title>
</head>

<body>
    <header>
        <h1>Svampletarna</h1>
        <button type="button" id="authButton">Logga in</button>
        <nav>
           <ul>

    <main>
        <section>
            <h2>Bloggen</h2>
            <button id="writePostBtn">Skapa inlägg</button>
            <p id="loginMessage">Du måste vara inloggad för att skapa ett inlägg</p>
        </section>
        <form> <!--Måste döljas om man inte är inloggad-->
            
            <label for="title">Titel: </label>
            <input type="text" id="title" name="title">

            <label for="content">Vad vill du säga: </label>
            <textarea id="content" name="content"></textarea>
            <input type="submit" value="Dela inlägg">
            <p id="missingInput">Saknar Titel eller Text.</p>

        </form>

        <section id="presentBlogPosts">
            <!--Här skrivs alla inlägg ut på sidan-->
            <!--<form>
                <label for="commentContent">Lämna en kommenter</label>
                <textarea id="commentContent" name="commentContent"></textarea>
            </form>-->
        </section>
